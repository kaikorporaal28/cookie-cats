<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Cookie Cats Gate Test</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <style>
    body { font-family: sans-serif; max-width: 900px; margin: 40px auto; padding: 0 16px; }
    .chart { width: 100%; height: 400px; margin-bottom: 40px; }
  </style>
</head>
<body>
  <h1>Cookie Cats: Moving the First Gate</h1>
  <p>Does moving the first gate from level 30 to level 40 change player retention?</p>

  <div id="retention-chart" class="chart"></div>
  <div id="buckets-chart" class="chart"></div>
  <div id="retention-bucket-chart" class="chart"></div>

  <script>
     fetch("data.json")
      .then(response => response.json())
     .then(data => {
        drawRetention(data.retention);
        drawBuckets(data.buckets);
    drawRetentionByBucket(data.retention_by_bucket);
    });

    function drawRetention(rows) {
      const chart = echarts.init(document.getElementById("retention-chart"));
      chart.setOption({
        title: { text: "Retention by Gate Version" },
        tooltip: {},
        legend: { top: 30 },
        xAxis: { type: "category", data: ["Day 1", "Day 7"] },
        yAxis: { type: "value", name: "% of players" },
        series: rows.map(row => ({
          name: row.version,
          type: "bar",
          data: [row.retention_1_percent, row.retention_7_percent]
        }))
      });
    }
  
    function drawBuckets(rows) {
    const chart = echarts.init(document.getElementById("buckets-chart"));

    // Bucket labels in order (already sorted by the SQL query)
    const buckets = [...new Set(rows.map(row => row.rounds_bucket))];
    const versions = [...new Set(rows.map(row => row.version))];

    const series = versions.map(version => {
        const versionRows = rows.filter(row => row.version === version);
        const total = versionRows.reduce((sum, row) => sum + row.n_players, 0);
        return {
        name: version,
        type: "bar",
        data: buckets.map(bucket => {
            const match = versionRows.find(row => row.rounds_bucket === bucket);
            return match ? +(match.n_players / total * 100).toFixed(1) : 0;
        })
        };
    });

    chart.setOption({
        title: { text: "Rounds Played in First 14 Days" },
        tooltip: { trigger: "axis", valueFormatter: value => value + "%" },
        legend: { top: 30 },
        xAxis: {type: "category",data: buckets,name: "Rounds played",nameLocation: "middle",nameGap: 30},
        yAxis: { type: "value", name: "% of players" },
        series: series
    });
    }
    function drawRetentionByBucket(rows) {
    const chart = echarts.init(document.getElementById("retention-bucket-chart"));

    const buckets = [...new Set(rows.map(row => row.rounds_bucket))];
    const versions = [...new Set(rows.map(row => row.version))];

    const series = versions.map(version => ({
    name: version,
    type: "bar",
    data: buckets.map(bucket => {
      const match = rows.find(row => row.version === version && row.rounds_bucket === bucket);
      return match ? { value: match.retention_7_percent, n: match.n_players } : { value: 0, n: 0 };
    })
  }));

  chart.setOption({
    title: { text: "Day-7 Retention by Rounds Played" },
    tooltip: {
      trigger: "axis",
      formatter: params => params[0].axisValue + "<br>" +
        params.map(p => `${p.marker} ${p.seriesName}: ${p.value}% (n = ${p.data.n.toLocaleString()})`).join("<br>")
    },
    legend: { top: 30 },
    xAxis: {type: "category",data: buckets,name: "Rounds played",nameLocation: "middle",nameGap: 30},
    yAxis: { type: "value", name: "% retained on day 7" },
    series: series
  });
    }
    </script>
</body>
</html>
